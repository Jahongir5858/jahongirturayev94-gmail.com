name: Telegram Search Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tse-preview.yml'

permissions:
  contents: write

concurrency:
  group: tse-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clone Telegram Search Engine
        run: git clone --depth 1 https://github.com/Brooksolomon/Telegram-Search-Engine.git tse

      - name: Configure preview environment
        working-directory: tse
        run: |
          cat > .env.prod <<'EOF'
          DOMAIN=localhost
          POSTGRES_USER=tgsearch
          POSTGRES_PASSWORD=preview-postgres-9f3c7b1a
          POSTGRES_DB=tgsearch
          MEILI_MASTER_KEY=preview-meili-5d8a2c4e
          CORS_ORIGINS=http://localhost
          NEXT_PUBLIC_REPO_URL=https://github.com/Brooksolomon/Telegram-Search-Engine
          EOF

      - name: Build and start stack
        working-directory: tse
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ip.yml --env-file .env.prod up -d --build
          docker compose -f docker-compose.yml -f docker-compose.ip.yml --env-file .env.prod ps

      - name: Wait for web app
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost/ >/dev/null 2>&1; then
              echo "Web app is responding"
              exit 0
            fi
            sleep 5
          done
          cd tse
          docker compose -f docker-compose.yml -f docker-compose.ip.yml --env-file .env.prod logs --tail=200
          exit 1

      - name: Install Cloudflare tunnel client
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Open temporary public preview
        run: |
          nohup ./cloudflared tunnel --url http://localhost:80 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              echo "PUBLIC_URL=$URL"
              echo "::notice title=Telegram Search Engine Preview::$URL"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Publish preview URL to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s\n' "$PUBLIC_URL" | base64 -w0)
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/tse-preview-url.txt"
          SHA=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API?ref=${GITHUB_REF_NAME}" 2>/dev/null | jq -r '.sha // empty' || true)
          BODY=$(jq -n --arg message "Update Telegram Search Engine preview URL" --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" --arg sha "$SHA" '{message:$message, content:$content, branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)')
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" -d "$BODY" >/dev/null
          echo "Published $PUBLIC_URL"

      - name: Keep preview online
        run: |
          echo "Preview URL: $PUBLIC_URL"
          echo "This temporary preview remains online while this workflow job is running."
          while true; do
            sleep 300
            curl -fsS http://localhost/ >/dev/null || true
          done
