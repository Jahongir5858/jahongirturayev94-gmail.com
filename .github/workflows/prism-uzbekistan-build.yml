name: Build and Deploy PRISM Uzbekistan

on:
  workflow_dispatch:
  push:
    branches:
      - prism-uzbekistan
    paths:
      - 'prism-uzbekistan-deploy/**'
      - '.github/workflows/prism-uzbekistan-build.yml'

concurrency:
  group: prism-uzbekistan-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: prism-uzbekistan-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Uzbekistan PRISM
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: prism-uzbekistan-dist
          path: prism-uzbekistan-deploy/dist
          if-no-files-found: error

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects="$(npx -y wrangler@latest pages project list --json)"
          if ! printf '%s' "$projects" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const a=JSON.parse(s);
              process.exit(a.some(p=>p.name==="prism-uzbekistan") ? 0 : 1);
            });
          '; then
            npx -y wrangler@latest pages project create prism-uzbekistan --production-branch=prism-uzbekistan
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy dist \
            --project-name=prism-uzbekistan \
            --branch=prism-uzbekistan \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_COMMIT_MESSAGE:-PRISM Uzbekistan deployment}"
