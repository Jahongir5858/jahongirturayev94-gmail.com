name: Fast Deploy PRISM Uzbekistan

on:
  workflow_dispatch:
  push:
    branches:
      - prism-uzbekistan
    paths:
      - '.github/workflows/prism-uzbekistan-deploy-fast.yml'

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified PRISM Uzbekistan build
        uses: actions/download-artifact@v4
        with:
          name: prism-uzbekistan-dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34046982149

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are missing from GitHub Actions secrets." >&2
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/prism-uzbekistan"
          status="$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$api")"

          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages project prism-uzbekistan already exists."
          elif [ "$status" = "404" ]; then
            echo "Creating Cloudflare Pages project prism-uzbekistan..."
            create_status="$(curl -sS -o /tmp/cf-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"name":"prism-uzbekistan","production_branch":"prism-uzbekistan"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            cat /tmp/cf-create.json
            if [ "$create_status" != "200" ]; then
              echo "Cloudflare Pages project creation failed with HTTP ${create_status}." >&2
              exit 1
            fi
          else
            cat /tmp/cf-project.json
            echo "Cloudflare Pages project lookup failed with HTTP ${status}. The token needs Pages Read/Write access for this account." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx -y wrangler@latest pages deploy dist \
            --project-name=prism-uzbekistan \
            --branch=prism-uzbekistan \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="PRISM Uzbekistan deployment"

      - name: Verify public URL
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/prism-home.html \
            https://prism-uzbekistan.pages.dev/
          grep -qi '<html' /tmp/prism-home.html
          echo 'Public URL verified: https://prism-uzbekistan.pages.dev/'
