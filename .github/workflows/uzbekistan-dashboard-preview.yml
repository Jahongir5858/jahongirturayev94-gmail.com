name: Uzbekistan Map Dashboard Live Preview

on:
  workflow_dispatch:
  push:
    branches:
      - uzbekistan-map-dashboard
    paths:
      - 'uzbekistan-dashboard/**'
      - '.github/workflows/uzbekistan-dashboard-preview.yml'

permissions:
  contents: write

concurrency:
  group: uzbekistan-dashboard-live-v2
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard source and data
        run: |
          set -euo pipefail
          node --check uzbekistan-dashboard/app.js
          node --check uzbekistan-dashboard/data-normalize.js
          for f in uzbekistan-dashboard/data-base.js uzbekistan-dashboard/data-2027-*.js uzbekistan-dashboard/data-208-*.js; do
            node --check "$f"
          done
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const dir='uzbekistan-dashboard';
          const ctx={window:{}};
          vm.createContext(ctx);
          const files=[
            'data-base.js',
            ...fs.readdirSync(dir).filter(x=>/^data-2027-[a-z]\.js$/.test(x)).sort(),
            ...fs.readdirSync(dir).filter(x=>/^data-208-[a-z]\.js$/.test(x)).sort(),
            'data-normalize.js'
          ];
          for(const f of files) vm.runInContext(fs.readFileSync(path.join(dir,f),'utf8'),ctx,{filename:f});
          const d=ctx.window.DASH_RAW;
          if (!d) throw new Error('DASH_RAW missing');
          if (d.c.length!==20) throw new Error(`2026 count invalid: ${d.c.length}`);
          if (d.p.length!==102) throw new Error(`2027 count invalid: ${d.p.length}`);
          if (d.d.length!==208) throw new Error(`208 count invalid: ${d.d.length}`);
          const regions=new Set([...d.c,...d.p,...d.d].map(x=>x[1]).filter(Boolean));
          if (regions.size!==14) throw new Error(`Region normalization invalid: ${regions.size}`);
          const badTypes=[...d.c,...d.p].map(x=>x[7]).filter(x=>x && !['Bino','Yer'].includes(x));
          if (badTypes.length) throw new Error(`Object type normalization invalid: ${[...new Set(badTypes)].join(', ')}`);
          const ids=[...d.c.map(x=>'c'+x[0]),...d.p.map(x=>'p'+x[0])];
          if(new Set(ids).size!==122) throw new Error('Duplicate object IDs found');
          console.log(JSON.stringify({centers2026:d.c.length,proposals2027:d.p.length,districts208:d.d.length,regions:regions.size,meta:d.m}));
          NODE

      - name: Start static server
        run: |
          nohup python3 -m http.server 4173 --directory uzbekistan-dashboard >/tmp/dashboard-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dashboard-http.log
          exit 1

      - name: Install browser smoke-test helper
        run: |
          mkdir -p /tmp/dashboard-smoke
          cd /tmp/dashboard-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.16.0 >/dev/null 2>&1
          cat > smoke.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          const url = process.argv[2];
          const screenshot = process.argv[3] || '/tmp/dashboard.png';
          const chrome = process.env.CHROME_BIN;
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--use-gl=swiftshader']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:900,deviceScaleFactor:1});
            const fatal=[];
            page.on('pageerror',e=>fatal.push(String(e)));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.object-card',{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.object-card').length===122,{timeout:20000});
            await page.waitForFunction(()=>document.querySelector('#regionSelect')?.options.length===15,{timeout:10000});
            await new Promise(r=>setTimeout(r,3500));
            const state=await page.evaluate(()=>({
              cards:document.querySelectorAll('.object-card').length,
              canvas:document.querySelectorAll('.maplibregl-canvas').length,
              kpi2026:document.querySelector('#kpi2026')?.textContent,
              kpi2027:document.querySelector('#kpi2027')?.textContent,
              kpi208:document.querySelector('#kpiDistricts')?.textContent,
              regionOptions:document.querySelector('#regionSelect')?.options.length,
              listSummary:document.querySelector('#listSummary')?.textContent,
              ready:document.body.dataset.dashboardReady||''
            }));
            console.log(JSON.stringify(state));
            if(state.cards!==122 || state.kpi2026!=='20' || state.kpi2027!=='102' || state.kpi208!=='208' || state.regionOptions!==15) throw new Error('Rendered dashboard state is invalid');
            if(fatal.some(x=>/SyntaxError|ReferenceError|TypeError/.test(x))) throw new Error('Browser runtime errors: '+fatal.join(' | '));
            await page.screenshot({path:screenshot,fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Local browser runtime test
        run: |
          node /tmp/dashboard-smoke/smoke.cjs http://127.0.0.1:4173/ /tmp/dashboard-local.png

      - name: Upload verified screenshot
        uses: actions/upload-artifact@v4
        with:
          name: uzbekistan-dashboard-screenshot
          path: /tmp/dashboard-local.png
          if-no-files-found: error

      - name: Install Cloudflare tunnel client
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Open public Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate >/tmp/cloudflared-dashboard.log 2>&1 &
          for i in {1..90}; do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-dashboard.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              echo "::notice title=Uzbekistan Dashboard::$URL"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared-dashboard.log
          exit 1

      - name: Verify public HTML
        run: |
          for i in {1..30}; do
            if curl -fsSL "$PUBLIC_URL/" | grep -q 'XARITA DASHBOARD'; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Publish current preview URL to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(printf '%s\n' "$PUBLIC_URL" | base64 -w0)
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/uzbekistan-dashboard-preview-url.txt"
          SHA=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API?ref=${GITHUB_REF_NAME}" 2>/dev/null | jq -r '.sha // empty' || true)
          BODY=$(jq -n --arg message "Update Uzbekistan dashboard preview URL" --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" --arg sha "$SHA" '{message:$message,content:$content,branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)')
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" -d "$BODY" >/dev/null
          echo "Published: $PUBLIC_URL"

      - name: Keep preview online
        run: |
          echo "Dashboard preview: $PUBLIC_URL"
          while true; do
            sleep 240
            curl -fsS http://127.0.0.1:4173/ >/dev/null || exit 1
          done
