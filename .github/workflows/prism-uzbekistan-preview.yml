name: PRISM Uzbekistan Live Preview

on:
  workflow_dispatch:
  push:
    branches:
      - prism-uzbekistan
    paths:
      - 'prism-uzbekistan-deploy/**'
      - '.github/workflows/prism-uzbekistan-preview.yml'

permissions:
  contents: write

concurrency:
  group: prism-uzbekistan-live-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build current PRISM Uzbekistan
        working-directory: prism-uzbekistan-deploy
        run: npm run build

      - name: Start SPA static server
        run: |
          cat > /tmp/prism-spa-server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from functools import partial
          from pathlib import Path

          root = Path('prism-uzbekistan-deploy/dist').resolve()

          class SPAHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  clean = self.path.split('?', 1)[0].split('#', 1)[0]
                  target = (root / clean.lstrip('/')).resolve()
                  if clean != '/' and (root not in target.parents and target != root):
                      self.send_error(403)
                      return
                  if clean != '/' and not target.exists():
                      self.path = '/index.html'
                  super().do_GET()

          handler = partial(SPAHandler, directory=str(root))
          ThreadingHTTPServer(('127.0.0.1', 4173), handler).serve_forever()
          PY
          nohup python3 /tmp/prism-spa-server.py > /tmp/prism-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4173/country/UZB >/dev/null 2>&1; then
              echo "PRISM SPA server is responding"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/prism-http.log
          exit 1

      - name: Browser runtime smoke test
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not found on runner; skipping browser smoke test."
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:4173/country/UZB > /tmp/prism-dom.html 2>/tmp/prism-chrome.log || true
          if ! grep -q 'id="app"' /tmp/prism-dom.html; then
            echo "PRISM React app did not mount." >&2
            tail -100 /tmp/prism-chrome.log >&2 || true
            head -80 /tmp/prism-dom.html >&2 || true
            exit 1
          fi
          echo "PRISM React runtime mounted successfully in headless Chrome."

      - name: Install Cloudflare tunnel client
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Open public Cloudflare Quick Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          for i in {1..90}; do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              echo "PUBLIC_URL=$URL"
              echo "::notice title=PRISM Uzbekistan Live Preview::$URL"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Verify public PRISM runtime
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsSL "$PUBLIC_URL/country/UZB" -o /tmp/prism-public.html && grep -qi '<html' /tmp/prism-public.html; then
              break
            fi
            sleep 2
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=15000 --dump-dom \
              "$PUBLIC_URL/country/UZB" > /tmp/prism-public-dom.html 2>/tmp/prism-public-chrome.log || true
            if ! grep -q 'id="app"' /tmp/prism-public-dom.html; then
              echo "Public PRISM React app did not mount." >&2
              tail -100 /tmp/prism-public-chrome.log >&2 || true
              exit 1
            fi
          fi
          echo "Public PRISM runtime verified: $PUBLIC_URL/country/UZB"

      - name: Publish current preview URL to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLIC_UZB_URL="${PUBLIC_URL}/country/UZB"
          CONTENT=$(printf '%s\n' "$PUBLIC_UZB_URL" | base64 -w0)
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/prism-preview-url.txt"
          SHA=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API?ref=${GITHUB_REF_NAME}" 2>/dev/null | jq -r '.sha // empty' || true)
          BODY=$(jq -n --arg message "Update PRISM Uzbekistan preview URL" --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" --arg sha "$SHA" '{message:$message, content:$content, branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)')
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" -d "$BODY" >/dev/null
          echo "Published $PUBLIC_UZB_URL"

      - name: Keep preview online
        run: |
          echo "PRISM Uzbekistan preview: $PUBLIC_URL/country/UZB"
          while true; do
            sleep 240
            curl -fsS http://127.0.0.1:4173/country/UZB >/dev/null || exit 1
          done
